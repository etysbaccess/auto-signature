<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCeSS - Request Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2130;
    --ink-soft:#4B5468;
    --navy:#126aed;
    --navy-deep:#072b5f;
    --brass:#B8863B;
    --brass-light:#E8C87A;
    --plum:#6E4A85;
    --green:#2F6F4E;
    --paper:#F3F4F7;
    --card:#FFFFFF;
    --line:#DFE3EA;
    --danger:#B4453A;
    --radius:14px;
    --shadow: 0 1px 2px rgba(18,37,64,.06), 0 8px 24px rgba(18,37,64,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{ font-family:'Fraunces',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; text-decoration:none !important; }
  button *, a{ text-decoration:none !important; }

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; background:var(--navy-deep); color:#F4F1E8;
    border-bottom:3px solid var(--brass);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--brass); }
  .brand span{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; }
  .nav-right{ display:flex; align-items:center; gap:14px; font-size:14px; flex-wrap:wrap; }
  .role-badge{
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08);
    padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.15);
  }
  .role-badge .chip{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:var(--brass-light); }
  .nav-link{ background:none; border:none; color:#DDE6F1; font-size:14px; text-decoration:underline; text-underline-offset:3px; }
  .nav-link:hover{ color:#fff; }

  main{ flex:1; padding:36px 28px 60px; max-width:1080px; margin:0 auto; width:100%; }

  .tracker-page{
    min-height:calc(100vh - 70px);
    background:
      linear-gradient(135deg, rgba(255,255,255,.72), transparent 42%),
      repeating-linear-gradient(135deg, rgba(18,110,237,.035) 0, rgba(18,110,237,.035) 1px, transparent 1px, transparent 34px),
      radial-gradient(circle at 86% 8%, rgba(184,134,59,.18), transparent 28%),
      radial-gradient(circle at 8% 78%, rgba(18,110,237,.12), transparent 32%),
      linear-gradient(145deg, #F7FAFE 0%, #E7EFF9 56%, #F8F3E9 100%);
  }

  .tracker-head{ margin-bottom:28px; }
  .tracker-head .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.14em; color:var(--brass); text-transform:uppercase; }
  .tracker-head h1{ margin:6px 0 4px; font-size:32px; }
  .tracker-head p{ margin:0; color:var(--ink-soft); }

  .search-panel{
    background:#fff; border:1px solid rgba(104,145,190,.22); border-radius:22px;
    padding:28px; box-shadow:0 18px 30px rgba(18,37,64,.08); margin-bottom:28px;
  }
  .search-panel h2{ margin:0 0 8px; font-size:20px; }
  .search-panel .subtitle{ margin:0 0 20px; color:var(--ink-soft); font-size:14px; }
  .search-form{ display:flex; gap:12px; flex-wrap:wrap; }
  .search-form input{
    flex:1; min-width:200px; padding:11px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fbfbfc;
  }
  .search-form input:focus{ background:#fff; outline:2px solid var(--brass); outline-offset:0; }
  .search-form button{
    background:linear-gradient(110deg, #011967, #011e7a 48%, #033d94);
    color:#fff; border:none; padding:11px 22px; border-radius:8px;
    font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px;
  }
  .search-form button:hover{
    background:linear-gradient(110deg, #012390, #032db8 48%, #2277f7);
  }

  .note-box{
    background:#FBF3E2; border:1px solid var(--brass-light); border-radius:10px;
    padding:12px 16px; font-size:13px; color:#6b4e12; margin-top:14px; line-height:1.5;
  }
  .note-box strong{ display:block; margin-bottom:4px; }

  .result-panel{
    background:#fff; border:1px solid rgba(104,145,190,.22); border-radius:22px;
    padding:28px; box-shadow:0 18px 30px rgba(18,37,64,.08); margin-top:28px;
  }

  .ticket-result{ display:flex; flex-direction:column; gap:18px; }
  .result-row{
    display:grid; grid-template-columns:140px 1fr; gap:12px;
    padding:14px; border:1px solid var(--line); border-radius:var(--radius);
    background:rgba(255,255,255,.6);
  }
  .result-row .label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em;
    color:var(--brass); text-transform:uppercase; font-weight:600;
  }
  .result-row .value{
    font-size:14px; color:var(--ink); word-break:break-word;
  }

  .status-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600;
    font-family:'IBM Plex Mono',monospace;
  }
  .status-badge.approved{
    background:#EAF1EC; color:var(--green);
  }
  .status-badge.signed{
    background:#EAF3FF; color:var(--blue);
  }
  .status-badge.processing{
    background:#FFF4E6; color:#b8620d;
  }
  .status-badge.pending{
    background:#FBEEDB; color:#8a5a12;
  }
  .status-badge.declined{
    background:#F8E8E6; color:var(--danger);
  }

  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
  }
  .empty-state .icon{ font-size:48px; margin-bottom:12px; }
  .empty-state h3{ margin:0 0 8px; font-size:18px; }
  .empty-state p{ margin:0; font-size:14px; }

  .error-message{
    background:#FBEAE8; border:1px solid rgba(180,69,58,.2); color:var(--danger);
    border-radius:var(--radius); padding:12px 16px; margin-top:12px; font-size:13px;
  }

  .back-link{ background:none; border:none; color:var(--navy); font-size:13px; font-weight:600; padding:0; margin-bottom:10px; text-decoration:underline; text-underline-offset:3px; }

  .loading{ display:inline-flex; align-items:center; gap:6px; }
  .spinner{
    width:14px; height:14px; border:2px solid rgba(0,0,0,.1); border-top-color:var(--navy);
    border-radius:50%; animation:spin .6s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:640px){
    main{ padding:24px 16px 50px; }
    .search-form{ flex-direction:column; }
    .search-form input, .search-form button{ width:100%; }
    .result-row{ grid-template-columns:1fr; }
    .tracker-head h1{ font-size:24px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAdJPrSgocSSQRz3Izker_vOOooCgxKU4YJXQPj-k5yCp1Q6nZR8RnPgm77QWBXtnn/exec';

let STATE = {
  ticketNumber: '',
  searchResult: null,
  isLoading: false,
  error: null
};

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(dateString) {
  if (!dateString) return 'N/A';
  try {
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return 'N/A';
    return date.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    return 'N/A';
  }
}

function getStatusBadgeClass(status) {
  const s = String(status || '').toLowerCase().trim();
  if (s === 'approved') return 'approved';
  if (s === 'signed') return 'signed';
  if (s === 'processing') return 'processing';
  if (s === 'declined') return 'declined';
  return 'pending';
}

async function searchTicket() {
  const ticketNumber = String(document.getElementById('ticketInput')?.value || '').trim();
  if (!ticketNumber) {
    STATE.error = 'Please enter a ticket number.';
    render();
    return;
  }

  STATE.isLoading = true;
  STATE.error = null;
  STATE.ticketNumber = ticketNumber;
  STATE.searchResult = null;
  render();

  try {
    const response = await fetch(`${SCRIPT_URL}?action=getPending`);
    const data = await response.json();
    
    if (!data.success || !data.data) {
      throw new Error('Could not fetch request data.');
    }

    const result = data.data.find(row => 
      String(row.requestNo || '').trim().toLowerCase() === ticketNumber.toLowerCase()
    );

    if (!result) {
      STATE.error = 'Ticket number not found. Please check and try again.';
      STATE.searchResult = null;
    } else {
      STATE.searchResult = result;
      STATE.error = null;
    }
  } catch (error) {
    STATE.error = 'Error fetching data: ' + error.message;
    STATE.searchResult = null;
  }

  STATE.isLoading = false;
  render();
}

function renderTopbar() {
  return `
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>ACCeSS</span>
    </div>
    <div class="nav-right">
      <button class="nav-link" onclick="goBack()">Back</button>
    </div>
  </header>`;
}

function renderResult() {
  if (!STATE.searchResult) return '';

  const result = STATE.searchResult;
  const statusClass = getStatusBadgeClass(result.status);
  const finalStatus = result.finalStatus || result.status || 'Pending';

  return `
  <div class="result-panel">
    <div class="ticket-result">
      <div class="result-row">
        <div class="label">Ticket #</div>
        <div class="value">${escapeHtml(result.requestNo)}</div>
      </div>
      <div class="result-row">
        <div class="label">Status</div>
        <div class="value">
          <span class="status-badge ${statusClass}">${escapeHtml(finalStatus)}</span>
        </div>
      </div>
      <div class="result-row">
        <div class="label">Request Type</div>
        <div class="value">${escapeHtml(result.request)}</div>
      </div>
      <div class="result-row">
        <div class="label">Updated Date</div>
        <div class="value">${escapeHtml(result.updatedDate || 'N/A')}</div>
      </div>
      ${result.remarks ? `
      <div class="result-row">
        <div class="label">Remarks</div>
        <div class="value">${escapeHtml(result.remarks)}</div>
      </div>
      ` : ''}
    </div>
  </div>`;
}

function render() {
  const content = `
  ${renderTopbar()}
  <div class="tracker-page">
  <main>
    <div class="tracker-head">
      <div class="eyebrow">Service Hub</div>
      <h1 class="serif">Request Tracker</h1>
      <p>Check the status of your submitted requests.</p>
    </div>

    <div class="search-panel">
      <h2>Search Your Request</h2>
      <p class="subtitle">Enter your ticket number to view the status of your request.</p>
      <div class="search-form">
        <input type="text" id="ticketInput" placeholder="Enter ticket number" 
          onkeypress="if(event.key==='Enter')searchTicket()">
        <button onclick="searchTicket()">
          ${STATE.isLoading ? '<span class="spinner"></span><span>Searching...</span>' : 'Search'}
        </button>
      </div>
      <div class="note-box">
        <strong>📧 Where to find your ticket number:</strong>
        Check your email for the confirmation message. Your ticket number was sent when you submitted your request.
      </div>
      ${STATE.error ? `<div class="error-message">${escapeHtml(STATE.error)}</div>` : ''}
    </div>

    ${STATE.searchResult ? renderResult() : ''}

    ${!STATE.searchResult && !STATE.error && STATE.ticketNumber && !STATE.isLoading ? `
    <div class="empty-state">
      <div class="icon">🔍</div>
      <h3>No match found</h3>
      <p>The ticket number you entered doesn't match any of your requests.</p>
    </div>
    ` : ''}

    ${!STATE.searchResult && !STATE.error && !STATE.ticketNumber && !STATE.isLoading ? `
    <div class="empty-state" style="margin-top:60px;">
      <div class="icon">📋</div>
      <h3>Search for your request</h3>
      <p>Enter your ticket number above to view request status and details.</p>
    </div>
    ` : ''}
  </main>
  </div>`;

  document.getElementById('app').innerHTML = content;
}

function goBack() {
  // Try to go back in history first
  if (window.history.length > 1) {
    window.history.back();
  } else {
    // Standalone Netlify fallback; this page does not depend on local HTML files.
    location.href = 'https://etysb-access.netlify.app/';
  }
}

render();
</script>
</body>
</html>
